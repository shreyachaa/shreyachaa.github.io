works:

- title: "Flexible Work Arrangements and Firm Outcomes: Experimental Evidence from India"
  abstract: >
    This paper studies the impact of flexible work arrangements on firm outcomes in the context of a large apparel manufacturing cluster in India. Production is organized as batch processing lines, where tasks are performed sequentially to produce the final product. In the status quo, production line workers (tailors) are hired on piece rate contracts, implying that (1) workers are free to choose their work schedules, resulting in significant dispersion in worker arrival times at the firm, and (2) workers are only incentivized on individual output, as opposed to firm output. I implement an experiment with 100 small factories (600 workers), where I incentivize workers in treatment firms to arrive at work by the owners’ preferred start time for a period of 4-weeks. Workers are paid a daily bonus equivalent to 15% of average earnings if they arrive on or before the start time. I find that incentives increase the likelihood that workers arrive on or before the preferred start time in treatment firms by 28% relative to control firms. These changes are driven by workers who were consistently late to arrive at the firm during the pre-incentive weeks, and female workers (who were more likely to be late at baseline). There is no effect on worker attendance, daily work hours and the total duration of breaks during the day. I find a statistically significant increase in weekly firm (worker) output by 23% (31%), resulting in an increase in firm revenues (worker earnings) by 31% (23%). Total labor costs incurred by the firm, including incentive payments made to workers, increase as well, albeit by a smaller magnitude, implying an increase in net revenues in treatment firms. 
